<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF4" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="book-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="600" rx="16" fill="url(#bg-grad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Subtle Dashed Inset Border -->
  <rect x="20" y="20" width="360" height="560" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Minimalist Book Silhouette Illustration -->
  <g transform="translate(140, 210)">
    <!-- Book Spine & Pages -->
    <rect x="15" y="10" width="90" height="120" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <path d="M15 10 L15 130" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Ribbon Bookmark -->
    <path d="M55 10 L55 55 L65 47 L75 55 L75 10 Z" fill="#B88B4A" opacity="0.9"/>

    <!-- Subtle Page Lines -->
    <line x1="32" y1="72" x2="88" y2="72" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="84" x2="88" y2="84" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="96" x2="70" y2="96" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography Labels -->
  <text x="200" y="380" text-anchor="middle" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#475569" letter-spacing="1.5">NO BOOK SELECTED</text>
  <text x="200" y="405" text-anchor="middle" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Personal Reading Vault</text>
</svg>
